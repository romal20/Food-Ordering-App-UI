name: food_ordering_app
description: "FoodieGo — Production-level Food Ordering App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_icons:
  android: true
  ios: true
  image_path: "assets/login/logo.png"
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/login/
    - assets/landing/
    - assets/images/

# Native splash (Android / iOS). Regenerate after changes: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FF6B00"
  image: assets/login/logo.png
  android_12:
    color: "#FF6B00"
    image: assets/login/logo.png
  ios: true
  android: true
  web: false
